name: secondhand_marketplace
description: "A second-hand marketplace app built with Flutter and Firebase."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Provides GlobalMaterialLocalizations/GlobalWidgetsLocalizations/
  # GlobalCupertinoLocalizations so built-in widgets (showDatePicker,
  # showTimePicker, etc.) render in Hebrew instead of defaulting to English
  # inside this fully RTL Hebrew app.
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1
  firebase_crashlytics: ^4.1.3

  # Local Notifications
  flutter_local_notifications: ^17.0.0

  # Payment Processing
  flutter_stripe: ^11.2.0

  # Google Sign In
  google_sign_in: ^6.2.1

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  web: ^1.1.0
  path_provider: ^2.1.5
  flutter_image_compress: ^2.3.0
  image: ^4.7.2

  # Location & Maps
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10

  # UI Components
  flutter_colorpicker: ^1.0.3

  # Utils
  intl: ^0.20.2
  timeago: ^3.7.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  http: ^1.2.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.6.2
  shared_preferences: ^2.5.3
  google_maps_flutter_platform_interface: ^2.14.1
  video_player: ^2.10.1
  video_thumbnail: ^0.5.3
  file_picker: ^10.3.7
  cloud_functions: ^5.6.2
  flutter_animate: ^4.5.2

  # Typography (White City design system: Secular One + Rubik, Hebrew-native)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
